<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Puppy Adoption Page</h1>
    <h3>Please enter your information to adopt a puppy and we'll email you back.</h3>
    <p> Please Note: First Name, Last Name, Password, and Email are required</p>
    <form>
    <input type="text" id="first name" placeholder="First Name"><br>
    <input type="text" id="last name" placeholder="Last Name"><br>

     <input type="email" id="email" name="email" placeholder="name@email.com"><br>
     <input type="password" id="password" name="password" placeholder="Password"><br>

     <p> are you over the age of 18?</p>
     <input type="radio" id="yes" name="age" value="yes">
        <label for="yes">Yes</label><br>
    <input type="radio" id="no" name="age" value="no">
        <label for="no">No</label><br>

    <p> Do you have a Credit Card or PayPal?</p>
    <select>
        <option value="credit">Credit Card</option>
        <option value="paypal">PayPal</option>
    </select>
    <button type="submit"> Submit</button>
</form>
</body>
</html>
